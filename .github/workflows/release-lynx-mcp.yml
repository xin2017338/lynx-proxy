name: Release Lynx MCP

on:
  push:
    tags: ["lynx-mcp-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar.gz, cross: false }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu, archive: tar.gz, cross: true }
          - { os: macos-13, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: macos-14, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lynx-mcp
      - uses: taiki-e/install-action@cross
        if: matrix.cross == true
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release -p lynx-mcp --target ${{ matrix.target }}
          else
            cargo build --release -p lynx-mcp --target ${{ matrix.target }}
          fi
      - name: Package Unix
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -czf lynx-mcp-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release lynx-mcp
      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/lynx-mcp.exe -DestinationPath lynx-mcp-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lynx-mcp-${{ matrix.target }}
          path: lynx-mcp-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/lynx-mcp-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lynx-mcp-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum lynx-mcp-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
